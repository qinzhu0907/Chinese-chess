# 完整 Docker 栈：应用 + Nginx（+ 可选 certbot 申请证书）
#
# 推荐用法（脚本会生成 nginx 配置、跑健康检查、签证书、自动切 HTTPS）：
#   bash deploy/docker-deploy.sh up
#   bash deploy/docker-deploy.sh ssl 你的域名 你的邮箱
#
# 手动用法（在项目根目录执行）：
#   cp deploy/nginx.docker.conf deploy/nginx.active.conf      # 首次
#   docker compose -f deploy/docker-compose.stack.yml up -d --build
#
# 申请 HTTPS 证书（域名需已解析到本机，且 80 端口可访问）：
#   docker compose -f deploy/docker-compose.stack.yml --profile cert run --rm certbot certonly \
#     --webroot -w /var/www/certbot -d 你的域名 --email 你的邮箱 --agree-tos --no-eff-email
#   然后把 deploy/nginx.ssl.conf.tpl 里的 __DOMAIN__ 换成你的域名，覆盖写入 deploy/nginx.active.conf，
#   再 docker compose -f deploy/docker-compose.stack.yml exec nginx nginx -s reload

services:
  xiangqi:
    build: ..
    container_name: xiangqi-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PER_MOVE: 60
      RECONNECT_GRACE: 120000
      MAX_ROOMS: 4000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:alpine
    container_name: xiangqi-nginx
    restart: unless-stopped
    depends_on:
      - xiangqi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 只在手动执行 certonly / renew 时启动，不常驻
  certbot:
    image: certbot/certbot
    profiles: ["cert"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-conf:
