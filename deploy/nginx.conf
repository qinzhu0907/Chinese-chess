# /etc/nginx/conf.d/xiangqi.conf
#
# 用法一（推荐）：交给脚本自动生成
#   sudo bash deploy/install.sh --domain chess.example.com --cert
#
# 用法二：手动
#   sed 's/chess.example.com/你的域名/g' deploy/nginx.conf | sudo tee /etc/nginx/conf.d/xiangqi.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的域名      # 自动改写为 HTTPS 并加 443 段
#
# 关键：/socket.io/ 必须带 Upgrade 头，否则联机对战会退化成轮询甚至连不上。

upstream xiangqi {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 让 WebSocket 连接能正确升级（若已在 http{} 里定义过可删掉这段，改用到 map）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess.example.com;

    # 申请证书后建议打开：把 HTTP 全量跳转到 HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;

    # 压缩（静态资源与 JSON 都能省一半流量）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 健康检查（不记日志，方便监控高频探测）
    location = /healthz {
        proxy_pass http://xiangqi;
        access_log off;
    }

    # Socket.IO —— WebSocket 升级 + 长连接
    location /socket.io/ {
        proxy_pass http://xiangqi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;     # 心跳间隔 20s，留足余量
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 其余请求（页面、静态资源、/api）
    location / {
        proxy_pass http://xiangqi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

