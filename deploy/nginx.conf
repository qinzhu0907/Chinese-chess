# /etc/nginx/conf.d/xiangqi.conf
# 把 chess.example.com 换成你自己的域名，然后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键：/socket.io/ 必须带上 Upgrade 头，否则联机对战会退化成轮询甚至连不上。

upstream xiangqi {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess.example.com;

    # 可选：把 HTTP 全部跳转到 HTTPS（申请证书后打开）
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;

    # 健康检查（不记日志）
    location = /healthz {
        proxy_pass http://xiangqi;
        access_log off;
    }

    # Socket.IO —— 必须支持 WebSocket 升级
    location /socket.io/ {
        proxy_pass http://xiangqi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;      # 长连接空闲时间
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # 静态页面与资源
    location / {
        proxy_pass http://xiangqi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

