# Docker 场景下的 Nginx 配置 · HTTP 版模板（app 与 nginx 在同一 compose 网络里，用服务名访问）
# 首次部署时由 deploy/docker-deploy.sh 复制为 deploy/nginx.active.conf 后挂载进容器；
# 签好证书后会被 deploy/nginx.ssl.conf.tpl 生成的 HTTPS 版覆盖。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;

    # Let's Encrypt 域名验证（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        proxy_pass http://xiangqi:3000;
        access_log off;
    }

    location /socket.io/ {
        proxy_pass http://xiangqi:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://xiangqi:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

