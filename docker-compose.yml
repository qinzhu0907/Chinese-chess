services:
  xiangqi:
    build: .
    # 也可以直接用镜像：image: ghcr.io/<你的用户名>/xiangqi-online:latest
    container_name: xiangqi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PER_MOVE: 60
      RECONNECT_GRACE: 120000
      MAX_ROOMS: 4000
    ports:
      - "3000:3000"   # 若前面已有 Nginx，可改成 "127.0.0.1:3000:3000" 只暴露本机
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
