<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ec">
<meta name="description" content="中国象棋在线对战：好友房间联机、快速匹配、观战，以及内置 AI 人机对局。">
<title>中国象棋 · 联机对战 &amp; AI 对局</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314110f'/%3E%3Ccircle cx='32' cy='32' r='25' fill='%23f7e9c8' stroke='%23b3272d' stroke-width='3'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23b3272d' font-family='serif'%3E帥%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<header class="topbar">
  <div class="brand">
    <span class="logo">帥</span>
    <div class="brand-text">
      <h1>中国象棋</h1>
      <p>联机对战 · 人机对局 · 观战</p>
    </div>
  </div>
  <nav class="top-nav" id="topNav">
    <button class="nav-btn on" data-nav="home">大厅</button>
    <button class="nav-btn" id="navLeaderboard">排行榜</button>
    <button class="nav-btn" id="navProfile">我的</button>
  </nav>
  <div class="top-actions">
    <span id="connDot" class="conn-dot" title="服务器连接状态"></span>
    <button id="userBadge" class="user-badge logged-out" title="个人档案"></button>
  </div>
</header>

<main class="home-main">
  <section class="home-hero">
    <span class="hero-kicker">READY TO PLAY</span>
    <h2>落子无悔<br><em>棋逢对手</em></h2>
    <p>选择你的战场，开始一局好棋</p>
  </section>

  <div class="dash-grid">
    <div class="dash"><b id="dashOnline">0</b><i>在线棋友</i></div>
    <div class="dash"><b id="dashPlaying">0</b><i>对局中</i></div>
    <div class="dash"><b id="dashWaiting">0</b><i>等待加入</i></div>
    <div class="dash rank-dash"><b id="dashRank">—</b><i id="dashRating">—</i></div>
  </div>

  <div class="mode-grid">
    <button class="mode-card mode-ai" id="goAi">
      <div class="mc-head"><span class="mc-icon">♟</span><span class="mc-tag">单机</span></div>
      <b>人机对战</b>
      <em>四档难度 · 随时开局</em>
      <span class="mc-go">开始 →</span>
    </button>
    <button class="mode-card mode-online" id="goOnline">
      <div class="mc-head"><span class="mc-icon">⚔</span><span class="mc-tag live">实时</span></div>
      <b>联机对战</b>
      <em>房间约战 · 快速匹配</em>
      <span class="mc-go">进入 →</span>
    </button>
  </div>

  <div class="board-panel">
    <div class="bp-head"><span class="bp-title">🏆 高手榜</span><button class="bp-more" id="btnLeaderboard">查看全部 →</button></div>
    <div class="home-leaders" id="homeLeaders"><div class="bp-empty">正在加载排行榜…</div></div>
  </div>

  <div class="board-panel latest-panel">
    <div class="bp-head"><span class="bp-title">🕘 最近对局</span><button class="bp-more" id="btnProfHome">我的战绩 →</button></div>
    <div class="home-recent" id="homeRecent"><div class="bp-empty">尚无对局</div></div>
  </div>

  <p class="stats" id="homeStats">正在读取服务器状态…</p>
  <details class="rule-fold">
    <summary>对局规则</summary>
    <p>红先黑后，将死或困毙对方为胜；同一局面出现三次判和，长将判负；60 回合无吃子判和；超时判负。</p>
  </details>
</main>

<footer class="foot">
  <span>中国象棋 · 开源项目</span>
  <a href="https://github.com/qinzhu0907/Chinese-chess" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="/js/core.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
